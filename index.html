<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Electronics Store</title>
        <link rel="icon" type="image/svg+xml" href="/logo.svg" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <link rel="canonical" href="https://www.electronics-store.ct.ws" />

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <link rel="apple-touch-icon" href="/icon-192x192.png" />

        <meta name="keywords" content="electronics, online store, gadgets, điện tử, mua sắm, technology" />
        <meta
            name="description"
            content="Electronics Store - Cửa hàng điện tử chuyên cung cấp các thiết bị và linh kiện điện chất lượng cao."
        />
        <meta name="author" content="Electronics Store Team" />
        <meta name="theme-color" content="#000000" />

        <meta property="og:title" content="Electronics Store - Tủ điện tốt nhất dành cho bạn" />
        <meta
            property="og:description"
            content="Khám phá nhiều loại thiết bị điện tử với nhiều ưu đãi hấp dẫn và giao hàng nhanh chóng!"
        />
        <meta property="og:image" content="https://www.electronics-store.ct.ws/social-preview.png" />
        <meta property="og:url" content="https://www.electronics-store.ct.ws" />
        <meta property="og:type" content="website" />

        <link href="https://fonts.googleapis.com/css?family=Signika:400,700&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Signika:wght@300..700&display=swap" rel="stylesheet" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Store",
                "name": "Electronics Store",
                "url": "https://www.electronics-store.ct.ws",
                "logo": "https://www.electronics-store.ct.ws/logo.svg",
                "description": "Cửa hàng điện tử chuyên cung cấp các thiết bị và linh kiện điện chất lượng cao.",
                "address": {
                    "@type": "PostalAddress",
                    "addressLocality": "Việt Nam",
                    "addressCountry": "VN"
                },
                "sameAs": ["https://zalo.me/#", "https://www.facebook.com/#"]
            }
        </script>
    </body>
</html>
